# Claim-Agent Python runtime configuration.
# Override any key with an experiment variant (experiments/*.yaml) or CLI flags.

model:
  default: gemini-3.8-flash        # verify with `claim-agent models`
  api_key_env: GEMINI_API_KEY
  max_output_tokens: 32768

# Which live provider runs the roles. Role files are provider-neutral; only transport, caching and
# thinking mapping differ (docs/python_runtime.md → 프로바이더). Fixtures/replay work for both.
provider:
  kind: gemini                     # gemini | anthropic | claude_oauth | codex_oauth
  claude_oauth:
    model: sonnet                  # default | sonnet | opus | haiku | account-accessible model ID
    timeout_s: 600
  codex_oauth:
    model: default                 # CLI account default, or account-accessible model ID
    timeout_s: 600
  anthropic:
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    thinking: adaptive             # adaptive | off (effort follows each role's thinking_level)
    fallbacks: default             # server-side refusal fallbacks (beta); none to disable
    structured_outputs: true

roles:
  # Each role can set provider + model independently. Omitted/null values inherit defaults.
  # Example: claim-drafter: {provider: claude_oauth, model: opus, thinking_level: HIGH}
  claim-architect:                       {thinking_level: HIGH,   temperature: 0.2}
  claim-drafter:                         {thinking_level: HIGH,   temperature: 0.3}
  claim-style-adjuster:                  {thinking_level: MEDIUM, temperature: 0.2, aux_mode: two_phase}
  claim-success-reviewer:                {thinking_level: HIGH,   temperature: 0.1}
  syntax-scope-reviewer:                 {thinking_level: HIGH,   temperature: 0.1}
  oa-strategy-reviewer:                  {thinking_level: HIGH,   temperature: 0.1}
  blind-claim-reconstruction-reviewer:   {thinking_level: MEDIUM, temperature: 0.7, cache: false, tools: false}
  picture-claim-reconstruction-reviewer: {thinking_level: HIGH,   temperature: 0.1}
  dependent-claim-strategy-architect:    {thinking_level: HIGH,   temperature: 0.2}

cache:
  enabled: true
  ttl: "3600s"
  min_expected_reuse: 2

pipeline:
  max_return_loops: {STYLE_ONLY: 2, DRAFTER: 2, ARCHITECT: 1, DEPENDENT_ARCHITECT: 1}
  max_concurrency: 3
  expand_multi_dependent: false
  retry: {max_attempts: 3, backoff_s: [2, 8, 20]}
  # Budget guard (null = unlimited). Checked before every call; the run halts with HALTED_BUDGET_LIMIT
  # and can be resumed after raising the limit (`claim-agent resume <run_id> --max-calls N`).
  max_calls: 60
  max_total_tokens: null
  max_cost_usd: null

paths:
  roles_dir: .claude/agents
  sources_dir: sources
  runs_dir: runs
  lessons_dir: lessons
  eval_dir: eval
  experiments_dir: experiments

lessons:
  inject: approved_only   # approved_only | none

telemetry:
  enabled: true
  # USD per 1M tokens. The values below are EXAMPLES from public price lists at the time of writing —
  # confirm against https://ai.google.dev/pricing and add the model you actually use (doctor warns when missing).
  pricing:
    gemini-2.5-flash: {input_per_m: 0.30, cached_per_m: 0.075, output_per_m: 2.50}
    gemini-2.5-pro:   {input_per_m: 1.25, cached_per_m: 0.31,  output_per_m: 10.00}
    claude-opus-5:    {input_per_m: 5.00, cached_per_m: 0.50,  output_per_m: 25.00}
    claude-sonnet-5:  {input_per_m: 2.00, cached_per_m: 0.20,  output_per_m: 10.00}
