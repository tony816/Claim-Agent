[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-agent"
version = "0.1.0"
description = "Claim-Agent: Python + Gemini runtime for the Korean patent-claim multi-agent pipeline"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.23.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "textual>=1.0,<2",
    "truststore>=0.10; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "Pillow>=10",
    "pypdf>=4",
    "python-docx>=1.1",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Remote MCP server (claim_agent.mcp_server) for claude.ai connectors; deploy/oci/cloud-init.yaml installs `.[mcp]`.
mcp = ["mcp==2.2.0"]

[project.scripts]
claim-agent = "claim_agent.cli:main"
claim-agent-tui = "claim_agent.tui:main"
claim-agent-web = "claim_agent.web:main"
# Compatibility for saved commands and reports created before the rename.
claim-copa = "claim_agent.cli:main"
claim-copa-tui = "claim_agent.tui:main"
claim-copa-web = "claim_agent.web:main"

[tool.setuptools.packages.find]
include = ["claim_agent*", "claim_copa*"]

[tool.setuptools.package-data]
"claim_agent.roles" = ["*.md"]
"claim_agent" = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires GEMINI_API_KEY and network"]

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["eval", "runs", ".tui", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["claim_agent", "claim_copa", "tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "silent"
exclude = ["tests/", "scripts/", "eval/"]
